<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>baidupcs-web · 百度网盘客户端</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header id="topbar">
    <a class="brand" href="#/files">📦 baidupcs-web</a>
    <nav id="nav">
      <a href="#/files">文件</a>
      <a href="#/transfers">传输</a>
      <a href="#/share">分享</a>
      <a href="#/offline">离线</a>
      <a href="#/recycle">回收站</a>
      <a href="#/settings">设置</a>
    </nav>
    <div id="quota-bar" class="quota" title="网盘配额(60s 内可能有缓存)"></div>
    <select id="account-sel" title="百度账号切换"></select>
    <button id="btn-add-account" title="绑定百度账号(BDUSS/Cookie)">+ 账号</button>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <a href="#/files">全部文件</a>
      <a href="#/transfers">传输列表</a>
      <a href="#/share">我的分享</a>
      <a href="#/offline">离线下载</a>
      <a href="#/recycle">回收站</a>
      <a href="#/settings">设置</a>
      <p class="muted side-note">上传 / 下载通道将在后续波次开启</p>
    </aside>
    <main id="main"></main>
  </div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
